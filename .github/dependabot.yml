version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps(python)"

  - package-ecosystem: "gradle"
    directory: "/src/java_plugins"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "java"]
    commit-message:
      prefix: "deps(java)"
