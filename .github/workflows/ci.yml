name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate_spec:
    name: Validate math & spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/qa_benchmarks/

  build_plugin:
    name: Build plugin
    runs-on: ubuntu-latest
    needs: validate_spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew shadowJar
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*.jar

  mockbukkit_tests:
    name: MockBukkit unit tests
    runs-on: ubuntu-latest
    needs: build_plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: build/test-results/test/TEST-*.xml

  e2e_paper_tests:
    name: PaperMC E2E stress test
    runs-on: ubuntu-latest
    needs: mockbukkit_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew plugwrightTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-logs
          path: logs/
