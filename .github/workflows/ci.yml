name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Validate Python math & specs ──────────────────────────
  validate_python:
    name: Validate particle math & specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run particle engine tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/qa_benchmarks/ -v
      - name: Run particle demo (smoke)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/particle_demo.py

  validate_bedrock:
    name: Validate and package Bedrock resource pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and package .mcpack
        run: python scripts/bedrock_pack.py --output dist/minecraft-production-factory.mcpack
      - name: Upload Bedrock resource pack
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-production-factory-bedrock
          path: dist/minecraft-production-factory.mcpack
          retention-days: 14

  # ── 2. Build Java plugin ─────────────────────────────────────
  build_plugin:
    name: Build PaperMC plugin
    runs-on: ubuntu-latest
    needs: validate_python
    container:
      image: gradle:8.10.2-jdk21
    defaults:
      run:
        working-directory: src/java_plugins
    steps:
      - uses: actions/checkout@v4
      - name: Build with ShadowJar
        run: gradle shadowJar --no-daemon
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: particle-factory-plugin
          path: src/java_plugins/build/libs/*.jar
          retention-days: 14

  # ── 3. Java unit tests ───────────────────────────────────────
  java_tests:
    name: Java unit tests
    runs-on: ubuntu-latest
    needs: build_plugin
    container:
      image: gradle:8.10.2-jdk21
    defaults:
      run:
        working-directory: src/java_plugins
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: gradle test --no-daemon
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: src/java_plugins/build/test-results/test/TEST-*.xml
          retention-days: 7

  # ── 4. Lint & format check ───────────────────────────────────
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile particles/*.py agents/*.py scripts/*.py
      - name: Validate workflow YAML
        run: |
          python -c "
          import yaml, glob
          for f in glob.glob('.github/workflows/*.yml') + ['.github/dependabot.yml']:
              with open(f) as fh:
                  d = yaml.safe_load(fh)
              assert d and ('jobs' in d or 'updates' in d), f'Invalid: {f}'
              print(f'OK: {f}')
          "
      - name: Check for TODO/FIXME
        run: |
          if grep -rn "TODO\|FIXME\|HACK" --include="*.py" --include="*.java" . ; then
            echo "::warning::Found TODO/FIXME markers"
          fi
