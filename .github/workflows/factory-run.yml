name: Factory Run

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Path to batch JSON file"
        required: true
        default: "config/batch_01.json"
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sunday midnight UTC

jobs:
  run_factory:
    name: Run particle factory batch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run orchestrator
        run: python -m agents.orchestrator --batch "${{ inputs.batch || 'config/batch_01.json' }}"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-run-${{ github.run_number }}
          path: |
            logs/
            memory/episodic/
            src/
          retention-days: 30
