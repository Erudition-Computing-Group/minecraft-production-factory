name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & publish release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/java_plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build plugin JAR
        run: gradle shadowJar --no-daemon
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src/java_plugins/build/libs/*.jar
          generate_release_notes: true
          body: |
            ## Particle Factory Plugin

            Compiled PaperMC plugin JAR with particle math engine.

            ### Installation
            1. Drop the JAR into your server's `plugins/` folder
            2. Ensure LuckPerms is installed
            3. Restart server
            4. Use `/cosmetics burst` or `/cosmetics orbit`
