name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & publish release
    runs-on: ubuntu-latest
    container:
      image: gradle:8.10.2-jdk21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build plugin JAR
        working-directory: src/java_plugins
        run: gradle shadowJar --no-daemon
      - name: Validate and package Bedrock resource pack
        run: python scripts/bedrock_pack.py --output dist/minecraft-production-factory.mcpack
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/java_plugins/build/libs/*.jar
            dist/minecraft-production-factory.mcpack
          body: |
            ## Minecraft Production Factory v0.0.1

            First public factory release. Includes the Golden Treasure sparkle pilot:

            - PaperMC plugin support via `/cosmetics treasure`
            - Bedrock resource-pack effect: `mpf:golden_treasure_sparkle`
            - Importable `minecraft-production-factory.mcpack`
            - JSON/spec validation and documented agent handoffs

            ### Test the Bedrock pack
            1. Download and open the `.mcpack` in Minecraft Bedrock for Windows.
            2. Activate **Minecraft Production Factory – Development Resource Pack** in a Creative world.
            3. Run `/particle mpf:golden_treasure_sparkle ~ ~1 ~3`.

            ### Test the PaperMC plugin
            1. Drop the JAR into a Paper 1.21.4 server's `plugins/` folder.
            2. Restart the server and run `/cosmetics treasure`.
