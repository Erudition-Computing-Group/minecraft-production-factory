# BlueMap Markers — Particle Effect Stations
# These markers appear on the web map at specific coordinates

marker-sets {
    particle-stations {
        label = "Particle Effect Stations"
        toggleable = true
        default-hidden = false

        markers {
            burst-station {
                type = "poi"
                label = "Burst Effects"
                position = [0, 65, 0]
                icon = "marker"
                min-distance = 0
                max-distance = 10000
            }
            orbit-station {
                type = "poi"
                label = "Orbit Effects"
                position = [10, 65, 0]
                icon = "marker"
                min-distance = 0
                max-distance = 10000
            }
            stream-station {
                type = "poi"
                label = "Stream Effects"
                position = [20, 65, 0]
                icon = "marker"
                min-distance = 0
                max-distance = 10000
            }
            vortex-station {
                type = "poi"
                label = "Vortex Effects"
                position = [30, 65, 0]
                icon = "marker"
                min-distance = 0
                max-distance = 10000
            }
            helix-station {
                type = "poi"
                label = "Helix Effects"
                position = [40, 65, 0]
                icon = "marker"
                min-distance = 0
                max-distance = 10000
            }
        }
    }
}