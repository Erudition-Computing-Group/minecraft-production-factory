# BlueMap Map Configuration for "world"
id = "world"
name = "Particle Factory Gallery"
world = "world"

# Render settings
render {
    # Render the world
    enabled = true
    # Render caves (false for performance)
    render-caves = false
    # Minimum Y level to render
    min-y = -64
    # Maximum Y level to render
    max-y = 320
}

# Webapp settings
web {
    # Enable 3D view
    enabled = true
}

# Marker sets (for particle effect locations)
marker-sets {
    particle-stations {
        label = "Particle Effect Stations"
        toggleable = true
        default-hidden = false
    }
}