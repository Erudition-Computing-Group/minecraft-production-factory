# BlueMap Core Configuration
# Web server settings
webserver {
    enabled = true
    port = 8100
    # Bind to all interfaces so it's accessible from host
    bind-address = "0.0.0.0"
    max-connections = 10
}

# Storage settings
storage {
    # Use file-based storage (default)
    type = "file"
}

# Accept downloads
accept-download = true