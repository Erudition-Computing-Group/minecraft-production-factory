services:
  # ── Python tests ──────────────────────────────────────────────
  python-tests:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    command: python -m pytest tests/qa_benchmarks/ -v

  # ── Python demo (smoke test) ──────────────────────────────────
  python-demo:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    command: python scripts/particle_demo.py

  # ── Java/Gradle build ─────────────────────────────────────────
  java-build:
    build:
      context: .
      dockerfile: Dockerfile.java
    volumes:
      - ./src/java_plugins:/app
    command: gradle shadowJar --no-daemon

  # ── Java tests ────────────────────────────────────────────────
  java-tests:
    build:
      context: .
      dockerfile: Dockerfile.java
    volumes:
      - ./src/java_plugins:/app
    command: gradle test --no-daemon

  # ── Full CI (all checks) ──────────────────────────────────────
  ci:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    command: >
      sh -c "
        python -m pytest tests/qa_benchmarks/ -v &&
        python scripts/particle_demo.py &&
        echo 'All Python checks passed!'
      "
    depends_on:
      - java-build

  # ── Minecraft PaperMC Server (local gallery) ──────────────────
  minecraft-server:
    image: itzg/minecraft-server:latest
    container_name: particle-factory-mc
    ports:
      - "25565:25565"
      - "25575:25575"  # RCON
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.4"
      MEMORY: "2G"
      MOTD: "Particle Factory Gallery Server"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "particlefactory"
      PLUGINS: ""
    volumes:
      - ./minecraft-data:/data
      - ./src/java_plugins/build/libs:/plugins:ro
    restart: unless-stopped
    tty: true
    stdin_open: true
