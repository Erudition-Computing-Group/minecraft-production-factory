services:
  # ── Python tests ──────────────────────────────────────────────
  python-tests:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    command: python -m pytest tests/qa_benchmarks/ -v

  # ── Python demo (smoke test) ──────────────────────────────────
  python-demo:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    command: python scripts/particle_demo.py

  # ── Java/Gradle build ─────────────────────────────────────────
  java-build:
    build:
      context: .
      dockerfile: Dockerfile.java
    volumes:
      - ./src/java_plugins:/app
    command: gradle shadowJar --no-daemon

  # ── Java tests ────────────────────────────────────────────────
  java-tests:
    build:
      context: .
      dockerfile: Dockerfile.java
    volumes:
      - ./src/java_plugins:/app
    command: gradle test --no-daemon

  # ── Full CI (all checks) ──────────────────────────────────────
  ci:
    build:
      context: .
      dockerfile: Dockerfile.python
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    command: >
      sh -c "
        python -m pytest tests/qa_benchmarks/ -v &&
        python scripts/particle_demo.py &&
        echo 'All Python checks passed!'
      "
    depends_on:
      - java-build

  # ── Factory (full pipeline test) ──────────────────────────────
  factory:
    build:
      context: .
      dockerfile: Dockerfile.factory
    volumes:
      - .:/app
      - factory-data:/app/minecraft-data
    environment:
      - PYTHONPATH=/app
      - LLM_HOST=http://ollama:11434
    ports:
      - "25565:25565"
    depends_on:
      - ollama
    command: >
      sh -c "
        echo '=== Running Python tests ===' &&
        python3 scripts/run_tests.py &&
        echo '=== Building plugin ===' &&
        cd src/java_plugins && gradle shadowJar --no-daemon && cd /app &&
        echo '=== Running particle demo ===' &&
        python3 scripts/particle_demo.py &&
        echo '=== Factory pipeline complete ==='
      "

  # ── Ollama (LLM for AG2 agents) ──────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: particle-factory-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # ── Minecraft PaperMC Server (local gallery) ──────────────────
  minecraft-server:
    image: itzg/minecraft-server:latest
    container_name: particle-factory-mc
    ports:
      - "25565:25565"
      - "25575:25575"
      - "8100:8100"  # BlueMap web viewer
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.4"
      MEMORY: "2G"
      MOTD: "Particle Factory Gallery Server"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "particlefactory"
      PLUGINS: |
        https://github.com/BlueMap-Minecraft/BlueMap/releases/download/v5.13/BlueMap-5.13-paper.jar
      LEVEL_TYPE: "FLAT"
      SPAWN_PROTECTION: "0"
      DIFFICULTY: "peaceful"
      MODE: "creative"
      USE_AIKAR_FLAGS: "true"
    volumes:
      - ./minecraft-data:/data
      - ./src/java_plugins/build/libs:/plugins:ro
      - ./bluemap-config:/config/bluemap:ro
    restart: unless-stopped
    tty: true
    stdin_open: true

volumes:
  factory-data:
  ollama-data: